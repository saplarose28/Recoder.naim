name: Record
on:
  workflow_dispatch:
    inputs:
      url:
        description: "m3u8 link"
        required: true
      minutes:
        description: "Stop after N minutes (0 = until you send /stop)"
        default: "120"
      name:
        description: "File name"
        default: "ClipByNaim"
      part_min:
        description: "New file every N minutes (60 = auto-save every hour while recording continues)"
        default: "60"
      part_mb:
        description: "...or every N MB, whichever comes first (GitHub allows under 2000 MB per file)"
        default: "1900"
      referer:
        description: "Optional: website the link is played on (only if the link needs it)"
        required: false
        default: ""

permissions:
  contents: write     # upload recordings to a Release
  actions: write      # lets a long recording continue in a new run

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      SHA: ${{ github.sha }}
      URL: ${{ inputs.url }}
      MINUTES: ${{ inputs.minutes }}
      NAME: ${{ inputs.name }}
      PART_MIN: ${{ inputs.part_min }}
      PART_MB: ${{ inputs.part_mb }}
      REFERER: ${{ inputs.referer }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Telegram uploader (only if TG_API_ID is set)
        if: ${{ env.TG_API_ID != '' }}
        run: python -m pip install pyrogram tgcrypto || python -m pip install pyrogram
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Record
        run: python gh_record.py
      - name: Upload leftovers if cancelled
        if: always()
        run: python gh_record.py finish
      - name: Keep files that failed to upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-uploads
          path: rec_failed/
          if-no-files-found: ignore
          retention-days: 3
